name:                smcdel-mcp
version:             0.1.0.0
synopsis:            MCP server exposing the SMCDEL model checker
description:         A Model Context Protocol server that exposes the TRUE?, VALID? and WHERE? queries of SMCDEL as tools over Streamable HTTP or stdio. See README.md.
homepage:            https://github.com/jrclogic/smcdel-mcp#readme
license:             BSD-3-Clause
author:              Malvin Gattinger
maintainer:          malvin@w4eg.eu
copyright:           2026 Malvin Gattinger
category:            Web
extra-source-files:
- README.md
- CHANGELOG.md

dependencies:
- base >= 4.7 && < 5
- aeson >= 2.0 && < 2.3
- bytestring
- containers
- deepseq
- HasCacBDD >= 0.4.0.0 && < 0.5
- smcdel
- text

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  dependencies:
  - http-types
  - scotty >= 0.20 && < 0.23
  - wai
  - warp

executables:
  smcdel-mcp:
    source-dirs:      app
    main:             Main.hs
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - smcdel-mcp

tests:
  spec:
    main:             Spec.hs
    source-dirs:      test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - smcdel-mcp
    - hspec
    - http-types
    - process
    - scientific
    - vector
    - wai
    - wai-extra
    build-tools:
    - hspec-discover
